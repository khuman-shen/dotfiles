<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">

  <script type="module" crossorigin src="/scripts/options.js"></script>
  <link rel="stylesheet" crossorigin href="/css/options.css">
  <link rel="stylesheet" crossorigin href="/css/bootstrap.css">
  <link rel="stylesheet" crossorigin href="/css/icons.css">
</head>

<body>
    <div class="m-5 d-flex justify-content-center">
        <div class="container">
            <div class="row>" id="optionsAppHeaderPanel">
                <div class="col p-0 mb-1">
                    <div>
                        <i class="ml-0 b-icon b-icon-gear b-icon-large mr-2 mb-1"></i>
                        <h4 class="d-inline-block" data-app-role="appNameTitle"></h4><small class="ml-2 d-inline-block"
                            data-app-role="appVersion"></small>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <div class="accordion" id="options">
                        <div class="card">
                            <div class="card-header" id="readerTabOptions">
                                <h2 class="mb-0">
                                    <button class="btn btn-link btn-block text-left" type="button"
                                        data-toggle="collapse" data-target="#collapseGeneral" aria-expanded="true"
                                        aria-controls="collapseGeneral" data-i18n-message="labelGeneral">
                                    </button>
                                </h2>
                            </div>
                            <div id="collapseGeneral" class="collapse show" aria-labelledby="readerTabOptions"
                                data-parent="#options">
                                <div class="card-body">
                                    <form id="qrReaderOptionsForm" novalidate>
                                        <div class="form-group form-check">
                                            <input type="checkbox" name="enableOnlineDecoding"
                                                data-app-role="enableOnlineDecodingCheck" class="form-check-input"
                                                id="enableOnlineDecodingCheck">
                                            <label class="form-check-label" for="enableOnlineDecodingCheck" data-i18n-message="settingEnableOnlineDecoding"></label>
                                            <small class="form-text text-muted" data-i18n-message="settingEnableOnlineHelpText">
                                            </small>
                                        </div>


                                        <div class="form-group form-check">
                                            <input type="checkbox" name="enableMultiDecoding"
                                                data-app-role="enableMultiDecodingCheck" class="form-check-input"
                                                id="enableMultiDecodingCheck">
                                            <label class="form-check-label" for="enableMultiDecodingCheck" data-i18n-message="settingEnableMultipleQr"></label>
                                            <small class="form-text text-muted" data-i18n-message="settingEnableMultipleQrHelpText">
                                            </small>
                                        </div>
                                        <div class="form-group form-check">
                                            <input type="checkbox" name="showParsed" class="form-check-input"
                                                data-app-role="showParsedCheck" id="showParsedCheck">
                                            <label class="form-check-label" for="showParsedCheck" data-i18n-message="settingShowParsedContentLabel"></label>
                                            <small class="form-text text-muted" data-i18n-message="settingShowParsedContentHelpText">
                                                
                                                
                                            </small>
                                        </div>
                                        <div class="form-group">
                                            <label for="maxQrCodeItems" class="col-form-label" data-i18n-message="settingShowMaxQrLabel"></label>
                                            <input style="width: 100px;" required type="number" id="maxQrCodeItems"
                                                min="1" max="10" name="maxQrCodeItems" data-app-role="maxQrCodeItems"
                                                class="form-control">
                                            <small class="form-text text-muted" data-i18n-message="settingShowMaxQrHelpText"></small>
                                        </div>
                                        <div class="form-group form-check">
                                            <input type="checkbox" name="showParsed" class="form-check-input"
                                                data-app-role="autoSaveScannedQrCheck" id="autoSaveScannedQrCheck">
                                            <label class="form-check-label" for="autoSaveScannedQrCheck" data-i18n-message="settingAutoSaveScannedLabel"></label>
                                        </div>

                                        <div class="form-group form-check">
                                            <input type="checkbox" name="offlineQR" class="form-check-input"
                                                data-app-role="enableOfflineQr" id="offlineQR">
                                            <label class="form-check-label" for="offlineQR" data-i18n-message="settingDynamicQrLabel">
                                               
                                            </label>
                                            <small class="form-text text-muted">
                                                <a target="_blank" href="https://tinyl.io/security" data-i18n-message="settingDynamicQrHelpText1|link"></a>
                                           
                                            <br />
                                            <b>
                                                <span class="form-text text-muted" data-i18n-message="settingDynamicQrHelpText2"></span>
                                            </b>
                                            </small>
                                        </div>

                                        <div class="form-row mt-4 mb-3">
                                            <div class="col">
                                                <button type="submit" class="btn btn-primary" data-i18n-message="labelSave"></button>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                        <div class="card">
                            <div class="card-header" id="qrFormatSettings">
                                <h2 class="mb-0">
                                    <button class="btn btn-link btn-block text-left collapsed" type="button"
                                        data-toggle="collapse" data-target="#collapseQrFormat" aria-expanded="false"
                                        aria-controls="collapseQrFormat" data-i18n-message="settingQrFormatLabel">
                                        
                                    </button>
                                </h2>
                            </div>
                            <div id="collapseQrFormat" class="collapse" aria-labelledby="qrFormatSettings"
                                data-parent="#options">
                                <div class="card-body">
                                    <div class="d-flex">
                                        <div class="flex-fill">
                                    <form id="qrFormatForm" novalidate>
                                        <div class="form-row mb-3">
                                            <label for="qrColor" class="col-form-label col-4" data-i18n-message="settingQrColorLabel"></label>
                                            <input style="width: 100px;" id="qrColor" data-app-role="qrForegroundColorInput" required
                                                type="color" name="qrColor"
                                                class="form-control">
                                            
                                        </div>
                                        <div class="form-row mb-3">
                                            <label for="qrBgColor" class="col-form-label col-4" data-i18n-message="settingQrBackgroundLabel"></label>
                                            <input style="width: 100px;" id="qrBgColor" value="#ffffff" data-app-role="qrBackgroundColorInput" required
                                                type="color" name="qrColor"
                                                class="form-control">
                                        </div>
                                        <div class="form-row mb-3">
                                            <label for="qrErrorCorrection" class="col-form-label  col-4" data-i18n-message="settingQrErrCorrectionLabel"></label>
                                            <select style="width: 150px;" id="qrErrorCorrection" required class="custom-select custom-select-sm" data-app-role="qrErrorCorrectionDropdown">
                                                <option value="L" selected data-i18n-message="qrQualityLowLabel"></option>
                                                <option value="M" data-i18n-message="qrQualityMediumLabel"></option>
                                                <option value="Q" data-i18n-message="qrQualityQuartileLabel"></option>
                                                <option value="H" data-i18n-message="qrQualityHighLabel"></option>
                                            </select>
                                        </div>
                                        <div class="form-row mb-3">
                                            <label for="qrImageFormat" class="col-form-label  col-4" data-i18n-message="settingQrImgFormatLabel"></label>
                                            <select style="width: 100px;" id="qrImageFormat" required class="custom-select custom-select-sm" data-app-role="qrImageFormatDropdown">
                                                <option value="png">png</option>
                                                <option value="jpeg">jpeg</option>
                                                <option value="webp">webp</option>
                                            </select>
                                        </div>
                                        <div class="form-row mb-3">
                                            <label for="qrMargin" class="col-form-label col-4" data-i18n-message="settingsQrMarginLabel"></label>
                                            <input style="width: 100px;" id="qrBgColor" data-app-role="qrMarginInput" required
                                                type="number" name="qrMargin" min="0" value="0" max="20" class="form-control">
                                            
                                        </div>
                                        <div class="alert alert-info p-1" data-i18n-message="labelComingSoon">
                                        </div>
                                        <div class="form-row mb-3">
                                            <label for="qrFrame" class="col-form-label  col-4" data-i18n-message="settingQrFrameLabel"></label>
                                            <select style="width: 100px;" id="qrFrame" disabled required class="custom-select custom-select-sm">
                                                <option value="" selected data-i18n-message="labelSelect"></option>
                                            </select>
                                        </div>
                                        <div class="form-row mb-3">
                                            <label for="qrStyle" class="col-form-label col-4" data-i18n-message="settingQrStyleLabel"></label>
                                            <select style="width: 100px;" id="qrStyle" disabled required class="custom-select custom-select-sm">
                                                <option value="" selected data-i18n-message="labelSelect"></option>
                                            </select>
                                        </div>
                                        <div class="form-row mb-3">
                                            <label for="qrSize" class="col-form-label col-4" data-i18n-message="settingQrSizeLabel"></label>
                                            <select style="width: 100px;" id="qrSize" disabled required class="custom-select custom-select-sm">
                                                <option value="" selected data-i18n-message="labelSelect"></option>
                                            </select>
                                        </div>
                                        <div class="form-row mb-3">
                                            <label for="qrLogo" class="col-form-label  col-4" data-i18n-message="settingQrLogoLabel"></label>
                                            <select style="width: 100px;" id="qrLogo" disabled required class="custom-select custom-select-sm">
                                                <option value="" selected data-i18n-message="labelSelect"></option>
                                            </select>
                                        </div>
                                        
                                        <div class="form-row mt-4 mb-3">
                                            <div class="col">
                                                <button type="submit" class="btn btn-primary" data-i18n-message="labelSave"></button>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                                    
                                    <div class="flex-fill text-center" id="qrCodePreviewPanel">
                                        <h6 data-i18n-message="labelPreview"></h6>
                                        <div class="p-0 m-0">
                                        <img class="border rounded" data-app-role="qrCodePreviewImg">
                                        </div>
                                    </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="card">
                            <div class="card-header" id="historySettings">
                                <h2 class="mb-0">
                                    <button class="btn btn-link btn-block text-left collapsed" type="button"
                                        data-toggle="collapse" data-target="#collapseHistory" aria-expanded="false"
                                        aria-controls="collapseHistory" data-i18n-message="labelHistory">
                                        
                                    </button>
                                </h2>
                            </div>
                            <div id="collapseHistory" class="collapse" aria-labelledby="historySettings"
                                data-parent="#options">
                                <div class="card-body">
                                    <form id="qrHistoryOptionsForm" novalidate>
                                        <div class="form-row mb-3">
                                            <label for="historyLimit" class="col-form-label" data-i18n-message="settingHistoryLimitLabel"></label>
                                            <input style="width: 100px;" data-app-role="historySize" required
                                                type="number" min="1" max="500" name="historyLimit"
                                                class="form-control">
                                            
                                        </div>
                                        <div class="alert alert-info p-1">
                                            <strong class="p-1 d-inline-block" data-i18n-message="labelComingSoon"></strong>
                                            <span data-i18n-message="settingSigninMoreText"></span>
                                        </div>
                                        <div class="ml-1 form-row form-check">
                                            <input disabled class="form-check-input" type="checkbox" value=""
                                                id="passwordProtection">
                                            <label class="form-check-label" for="passwordProtection" data-i18n-message="settingSyncHistoryLabel">
                                                
                                            </label>
                                        </div>
                                        <div class="ml-1 form-row form-check">
                                            <input disabled class="form-check-input" type="checkbox" value=""
                                                id="passwordProtection">
                                            <label class="form-check-label" for="passwordProtection" data-i18n-message="settingEnableDynamicQrStats">
                                                
                                            </label>
                                        </div>
                                        <div class="form-row mt-4 mb-3">
                                            <div class="col">
                                                <button type="submit" class="btn btn-primary" data-i18n-message="labelSave"></button>
                                            </div>
                                        </div>
                                </div>
                            </div>
                        </div>
                        <div class="card">
                            <div class="card-header" id="dynamicQrOptions">
                                <h2 class="mb-0">
                                    <button class="btn btn-link btn-block text-left collapsed" type="button"
                                        data-toggle="collapse" data-target="#collapseDynamicQr" aria-expanded="false"
                                        aria-controls="collapseDynamicQr" data-i18n-message="settingDynamicQrOptionsLabel">
                                        
                                    </button>
                                </h2>
                            </div>
                            <div id="collapseDynamicQr" class="collapse" aria-labelledby="dynamicQrOptions"
                                data-parent="#options">
                                <div class="card-body">
                                    <form data-app-role="dynamicQrCodeSettingsForm">

                                        <div class="alert alert-info p-1 mb-1" role="alert" data-i18n-message="settingDoMoreDynamicQrText">
                                            <strong data-i18n-message="settingDynamicQrComingSoon"></strong>
                                            <hr class="p-1 m-1" />
                                            
                                        </div>
                                        <div class="form-check">
                                            <input disabled class="form-check-input" type="checkbox" value=""
                                                id="customLinks" required>
                                            <label class="form-check-label" for="customLinks" data-i18n-message="settingEnableCustomLinksLabel">
                                            </label>
                                        </div>
                                        <div class="form-check">
                                            <input disabled class="form-check-input" type="checkbox" value=""
                                                id="passwordProtection" required>
                                            <label class="form-check-label" for="passwordProtection" data-i18n-message="settingEnablePasswordLabel">
                                            </label>
                                        </div>
                                        <div class="form-check">
                                            <input disabled class="form-check-input" type="checkbox" value=""
                                                id="passwordProtection" required>
                                            <label class="form-check-label" for="passwordProtection" data-i18n-message="settingEnableExpiryLabel">
                                                
                                            </label>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                        <div class="card">
                            <div class="card-header" id="qrTypesOptions">
                                <h2 class="mb-0">
                                    <button class="btn btn-link btn-block text-left collapsed" type="button"
                                        data-toggle="collapse" data-target="#collapseQrTypes" aria-expanded="false"
                                        aria-controls="collapseQrTypes" data-i18n-message="labelQRTypes">
                                        
                                    </button>
                                </h2>
                            </div>
                            <div id="collapseQrTypes" class="collapse" aria-labelledby="qrTypesOptions"
                                data-parent="#options">
                                <div class="card-body">
                                    <div class="alert alert-success" role="alert">
                                        <h4 class="alert-heading" data-i18n-message="settingMoreQrTypesLabel"></h4>
                                        <p data-i18n-message="labelComingSoon"></p>
                                        <hr>
                                        <p class="mb-0"><a data-i18n-message="specificQrTypeHelpText|link" href="https://ggle.io/QRExt4Help" target="_blank"></a></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="card">
                            <div class="card-header" id="tools">
                                <h2 class="mb-0">
                                    <button class="btn btn-link btn-block text-left collapsed" type="button"
                                        data-toggle="collapse" data-target="#collapseTools" aria-expanded="false"
                                        aria-controls="collapseTools" data-i18n-message="labelTools">
                                    </button>
                                </h2>
                            </div>
                            <div id="collapseTools" class="collapse" aria-labelledby="tools" data-parent="#options">
                                <div class="card-body">
                                    <ul class="list-style-none">
                                        <li><a target="_blank" href="https://ggle.io/QRExtScanImage" data-i18n-message="decodeToolLabel"></a>
                                        </li>
                                        <li><a target="_blank" href="https://ggle.io/QRExtScanCamera" data-i18n-message="cameraDecodeTool"></a>
                                        </li>
                                        <li><a target="_blank" href="https://ggle.io/QRCode" data-i18n-message="createLinksAnalyticsTool"></a></li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                        <div class="card">
                            <div class="card-header" id="faq">
                                <h2 class="mb-0">
                                    <button class="btn btn-link btn-block text-left collapsed" type="button"
                                        data-toggle="collapse" data-target="#collapseFaq" aria-expanded="false"
                                        aria-controls="collapseFaq" data-i18n-message="labelFaq">
                                        
                                    </button>
                                </h2>
                            </div>
                            <div id="collapseFaq" class="collapse" aria-labelledby="faq" data-parent="#options">
                                <div class="card-body">
                                    <div class="list-group list-group-flush">
                                        <div class="list-group-item">
                                            <h6 data-i18n-message="faq1Question"></h6>
                                            <p>
                                                <a data-i18n-message="faq1Answer|link" target="_blank" href="https://en.wikipedia.org/wiki/QR_code"></a>
                                            </p>
                                        </div>
                                        <div class="list-group-item">
                                            <h6 data-i18n-message="faq2Question"></h6>
                                            <p data-i18n-message="faq2Answer"></p>
                                        </div>
                                        <div class="list-group-item">
                                            <h6 data-i18n-message="faq3Question"></h6>
                                            <p data-i18n-message="faq3Answer"></p>
                                        </div>
                                        <div class="list-group-item">
                                            <h6 data-i18n-message="faq4Question"></h6>
                                            <p><a href="https://qrcd.org" target="_blank" data-i18n-message="faq4Answer|link">qrcd.org</a>
                                                </p>
                                        </div>
                                        <div class="list-group-item">
                                            <h6 data-i18n-message="faq5Question">
                                            </h6>
                                            <p data-i18n-message="faq5Answer"></p>
                                        </div>
                                        <div class="list-group-item">
                                            <h6 data-i18n-message="faq6Question"></h6>
                                            <p><a data-i18n-message="faq6Answer|link"
                                                    href="https://en.wikipedia.org/wiki/QR_code"
                                                    target="_blank">https://en.wikipedia.org/wiki/QR_code</a></p>
                                        </div>
                                        <div class="list-group-item">
                                            <h6 data-i18n-message="faq7Question"></h6>
                                            <p><a data-i18n-message="faq7Answer|link" href="https://qrcd.org/privacy.html"
                                                    target="_blank">https://qrcd.org/privacy.html</a>.</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="libs/jquery.js"></script>
    <script src="libs/notify.min.js"></script>
    <script src="libs/bootstrap.bundle.min.js"></script>
</body>

</html>
