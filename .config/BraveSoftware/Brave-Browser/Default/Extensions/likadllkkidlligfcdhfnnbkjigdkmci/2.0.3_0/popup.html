<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>QR Code reader</title>
  <script type="module" crossorigin src="/scripts/popup.js"></script>
  <link rel="stylesheet" crossorigin href="/css/bootstrap.css">
  <link rel="stylesheet" crossorigin href="/css/app.css">
  <link rel="stylesheet" crossorigin href="/css/icons.css">
</head>

<body>
  <div class="container m-0 p-0">
    <header class="row pt-2 pl-2 pr-2">
      <div class="col">
        <ul class="nav nav-pills nav-fill bg-white border position-relative" role="tablist">
          <li class="nav-item" role="presentation">
            <a class="nav-link active" data-toggle="pill" data-app-role="readerTabButton" href="#qrcode-reader" role="tab"
              aria-controls="qrcode-reader" aria-selected="true" data-i18n-message="labelQrCodeReader">
              <i class="b-icon b-icon-qr-code-scan mr-2"></i></a>
          </li>
          <li class="nav-item" role="presentation">
            <a i18-message class="nav-link"  data-toggle="pill" href="#create-qr" role="tab" 
            data-app-role="createQrTabButton"
            aria-controls="profile" aria-selected="false" data-i18n-message="labelCreateQr">
            <i class="b-icon b-icon-qr-code mr-2"></i></a>
          </li>
          <li class="nav-item" role="presentation">
            <a class="nav-link" data-app-role="historyTabButton" data-toggle="pill" href="#history" role="tab" aria-controls="profile"
              aria-selected="false" data-i18n-message="labelHistory"><i class="b-icon b-icon-clock-history mr-2"></i> </a>
          </li>
          <li class="nav-item" role="presentation">
            <a class="nav-link" data-app-role="historyTabButton" data-toggle="pill" href="#comingsoon" role="tab" aria-controls="profile"
              aria-selected="false"
              data-i18n-message="labelComingSoon">
              <i class="b-icon b-icon-megaphone mr-2"></i> </a>
          </li>
         <li class="tab-line" data-app-role="selectedTabBorder">
         </li>
        </ul>
      </div>
    </header>

    <main class="tab-content ml-2 mr-2 mb-1 shadow-sm">
      <div class="card tab-pane fade show active" id="qrcode-reader">
        <div class="container card-body h-100" data-app-role="readerTabBody">
          
        </div>
      </div>
      <div class="d-none card tab-pane fade show" id="create-qr">
        <div class="container card-body" data-app-role="createTabBody">
          
        </div>
      </div>
      <div class="d-none card tab-pane fade show" id="history">
        <div class="container card-body pb-0 h-100" data-app-role="historyTabBody">
          
        </div>
      </div>
      <div class="d-none card tab-pane fade show" id="comingsoon">
        <div class="container card-body">
        <div class="alert alert-info">
        <h4 data-i18n-message="labelUpcomingFeatures"></h4>
        <hr />
        <ul data-i18n-message="upcomingFeaturesList|html">
         
        </ul>
        </div>
      </div>
    </main>
    <footer class="mt-2 mb-1 row justify-content-center footer">
      <a href="https://ggle.io/QRHome/" target="_blank" data-i18n-message="labelHome">
          🏠  </a> <span class="copyright"> | </span>
      <a href="https://ggle.io/QRExt4Help" target="_blank" data-i18n-message="labelContact">✉  </a>
      <span class="copyright"> | </span>
      <a href="options.html" target="_blank" data-i18n-message="labelSettings">
          ⚙ 
      </a> <span class="copyright"> | </span>
      <a href="options.html#faq" target="_blank" data-i18n-message="labelFaq">
        🗒 
    </a> <span class="copyright"> | </span>
    <a href="https://qrcd.org/privacy.html" target="_blank" data-i18n-message="labelPrivacy">
      🔒 
  </a>
  </footer>
    <script src="libs/jquery.js"></script>
    <script src="libs/notify.min.js"></script>
    <script src="libs/bootstrap.bundle.min.js"></script>
</body>

</html>
